<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.tagline | strip_html | truncate: 160 }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  {% if page.cover %}<meta property="og:image" content="{{ page.cover | absolute_url }}">{% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.author_name }}</a>
      <nav>
        <a href="{{ '/' | relative_url }}#books">Books</a>
        <a href="{{ '/' | relative_url }}#about">About</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>&copy; {{ 'now' | date: '%Y' }} {{ site.author_name }}</p>
      {% if site.amazon_author_url != "" %}<p><a href="{{ site.amazon_author_url }}">Follow on Amazon</a></p>{% endif %}
    </div>
  </footer>
</body>
</html>
